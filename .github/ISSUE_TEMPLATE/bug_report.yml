name: Bug Report
description: Report a bug in ToolBox Pro
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the information below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what happened...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
      placeholder: Tell us what you expected...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
      placeholder: Tell us what actually happened...
    validations:
      required: true

  - type: dropdown
    id: tool
    attributes:
      label: Affected Tool
      description: Which tool is affected (if applicable)?
      options:
        - None / General
        - Password Generator
        - Hash Generator
        - Hash Checker
        - Base64 Tool
        - JWT Decoder
        - JSON Formatter
        - XML Formatter
        - YAML Formatter
        - Regex Tester
        - URL Encoder
        - UUID Generator
        - Timestamp Converter
        - Color Converter
        - Remove Duplicates
        - File Splitter
        - File Merger
        - Folder Size Analyzer
        - Duplicate File Finder
        - Image Converter
        - Image Compressor
        - Image Resizer
        - Image Metadata
        - Color Picker
        - QR Generator
        - Barcode Generator
        - Notes
        - Todo Manager
        - Pomodoro Timer
        - Stopwatch
        - Countdown Timer
        - Settings
        - Other
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: App Version
      description: What version of ToolBox Pro are you using?
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What OS are you running?
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Add screenshots if applicable.
      placeholder: Drag and drop screenshots here...
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here.
      placeholder: Any other information...
    validations:
      required: false
